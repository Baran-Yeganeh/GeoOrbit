{% url 'mainPage' as home_url %}
<nav class="go-nav" id="goNav">
  <div class="container">

    <a href="{% url 'mainPage' %}" class="go-brand">
      <svg class="go-brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6" fill="#ffb347"/>
        <g class="ring"><ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="#eaf0f7" stroke-width="1.2" transform="rotate(-28 16 16)"/>
        <circle cx="28" cy="10.4" r="2" fill="#54d2ff" transform="rotate(-0 16 16)"/></g>
      </svg>
      <span class="go-brand-name">GeoOrbit<i>.</i></span>
    </a>

    <ul class="go-links">
      <li><a href="{% url 'mainPage' %}" {% if request.path == home_url %}class="active"{% endif %}>Home</a></li>
      <li><a href="{% url 'mission_list' %}" {% if '/gnss/' in request.path %}class="active"{% endif %}>Missions</a></li>
    </ul>

    <div class="go-search">
      <span class="ico">⌕</span>
      <input type="search" id="searchInput" placeholder="Search missions…" aria-label="Search missions" autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>

    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="go-auth">
      {% csrf_token %}<button type="submit" class="go-auth-btn">Sign out ({{ user.username }})</button>
    </form>
    {% else %}
    <a href="{% url 'login' %}" class="go-auth-btn">Sign in</a>
    {% endif %}

    <button class="go-burger" id="goBurger" aria-label="Menu">☰</button>
  </div>
</nav>
