{% for field in form %}
<div class="fld {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}
    {{ field.errors }}
</div>
{% endfor %}
{{ form.non_field_errors }}
